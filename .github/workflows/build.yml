name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project.zip
        run: |
          test -f project.zip || { echo "project.zip tidak ada di root repo"; exit 1; }
          rm -rf _proj && mkdir _proj
          unzip -q project.zip -d _proj
          S=$(find _proj -maxdepth 3 -name settings.gradle.kts | head -n 1)
          test -n "$S" || { echo "settings.gradle.kts tidak ditemukan di zip"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$S")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK (signed with debug key)
        run: gradle -p "$PROJECT_DIR" assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp "$PROJECT_DIR"/app/build/outputs/apk/release/app-release.apk LiteTunnel.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LiteTunnel-apk
          path: LiteTunnel.apk

      - name: Publish release (only for tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LiteTunnel.apk
