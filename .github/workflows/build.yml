name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cari project (zip atau folder)
        run: |
          set -e
          echo "Isi root repo:"; ls -la
          S=""
          if [ -f project.zip ]; then
            Z=./project.zip
          else
            S=$(find . -maxdepth 4 -name settings.gradle.kts -not -path './.git/*' | head -n 1)
            if [ -z "$S" ]; then
              N=$(find . -maxdepth 1 -iname '*.zip' | wc -l)
              if [ "$N" -eq 1 ]; then
                Z=$(find . -maxdepth 1 -iname '*.zip')
              elif [ "$N" -eq 0 ]; then
                echo "ERROR: tidak ada project.zip / settings.gradle.kts di root repo."
                exit 1
              else
                echo "ERROR: ada $N file zip di root dan tidak ada project.zip."
                echo "Hapus zip lama, sisakan satu bernama project.zip."
                find . -maxdepth 1 -iname '*.zip'
                exit 1
              fi
            fi
          fi
          if [ -z "$S" ]; then
            echo "Memakai zip: $Z"
            rm -rf _proj && mkdir _proj
            unzip -q "$Z" -d _proj
            S=$(find _proj -maxdepth 4 -name settings.gradle.kts | head -n 1)
          fi
          test -n "$S" || { echo "ERROR: settings.gradle.kts tidak ditemukan"; exit 1; }
          D=$(dirname "$S")
          if grep -rq "javax.net.SocketFactory" "$D/app/src" 2>/dev/null; then
            echo "ERROR: yang terpakai adalah ZIP LAMA (masih ada javax.net.SocketFactory)."
            echo "Upload ulang project.zip terbaru dengan nama persis project.zip, lalu hapus zip lain."
            exit 1
          fi
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
          echo "Project ditemukan di: $D"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK (signed with debug key)
        run: |
          set -o pipefail
          gradle -p "$PROJECT_DIR" assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      - name: Tampilkan ERROR UTAMA (hanya jika gagal)
        if: failure()
        run: |
          echo "=============== ERROR UTAMA ==============="
          grep -nE "^e: |error:|What went wrong|Execution failed|Caused by|Could not" -A4 build.log | head -n 80 || true

      - name: Rename APK
        run: cp "$PROJECT_DIR"/app/build/outputs/apk/release/app-release.apk LiteTunnel.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LiteTunnel-apk
          path: LiteTunnel.apk

      - name: Publish release (only for tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LiteTunnel.apk
