name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cari project (zip atau folder)
        run: |
          set -e
          echo "Isi root repo:"; ls -la
          S=$(find . -maxdepth 4 -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          if [ -z "$S" ]; then
            Z=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
            if [ -z "$Z" ]; then
              echo "ERROR: tidak ada settings.gradle.kts dan tidak ada file .zip di root repo."
              echo "Upload project.zip ke halaman utama repo (bukan di dalam folder)."
              exit 1
            fi
            echo "Memakai zip: $Z"
            rm -rf _proj && mkdir _proj
            unzip -q "$Z" -d _proj
            S=$(find _proj -maxdepth 4 -name settings.gradle.kts | head -n 1)
          fi
          test -n "$S" || { echo "ERROR: settings.gradle.kts tidak ditemukan di zip"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$S")" >> "$GITHUB_ENV"
          echo "Project ditemukan di: $(dirname "$S")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK (signed with debug key)
        run: |
          set -o pipefail
          gradle -p "$PROJECT_DIR" assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      - name: Tampilkan ERROR UTAMA (hanya jika gagal)
        if: failure()
        run: |
          echo "=============== ERROR UTAMA ==============="
          grep -nE "^e: |error:|What went wrong|Execution failed|Caused by|Could not" -A4 build.log | head -n 80 || true

      - name: Rename APK
        run: cp "$PROJECT_DIR"/app/build/outputs/apk/release/app-release.apk LiteTunnel.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LiteTunnel-apk
          path: LiteTunnel.apk

      - name: Publish release (only for tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LiteTunnel.apk
